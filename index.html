<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опросник перед обучением</title>
<meta name="description" content="Опросник перед обучением работе с ИИ.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#form">К вопросам</a>
<div class="topline" aria-hidden="true"><i id="topline"></i></div>

<div class="page">
  <header class="hero">
    <h1 class="title">Опросник перед обучением</h1>
    <p class="sub">15 вопросов, около пяти минут. Ответы видят только Кирилл и Александр.</p>
    <p class="counter" id="counter" aria-live="polite">Отвечено 0 из 15</p>
  </header>

  <div class="notice" id="notice" hidden role="status"></div>

  <form id="form" class="form" novalidate>
    <!-- заполняется скриптом -->
    <div class="submit-card">
      <button type="submit" class="btn primary" id="submit">Отправить ответы</button>
      <p class="submit-hint">Черновик сохраняется на этом устройстве, пока вы не отправите ответы.</p>
      <div class="panel error" id="error" hidden role="alert"></div>
    </div>
  </form>

  <section class="card success" id="success" hidden tabindex="-1">
    <h2 class="card-title">Ответы отправлены</h2>
    <p>Спасибо. Если захотите что-то добавить, напишите Кириллу в Telegram.</p>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
